name: Windows — compilar e testar Orthck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar núcleo
        run: dotnet build src/Orthck.Core/Orthck.Core.csproj --configuration Release
      - name: Testes de regressão sem Word
        run: dotnet run --project tests/Orthck.SmokeTests/Orthck.SmokeTests.csproj --configuration Release
      - name: Compilar aplicativo WPF
        run: dotnet build src/Orthck.Windows/Orthck.Windows.csproj --configuration Release
      # x64: PCs comuns. arm64: Windows 11 em Mac com chip Apple (Parallels/VMware/UTM).
      - name: Publicar versões de teste
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/Orthck.Windows/Orthck.Windows.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=false -o "dist/Orthck-Windows-$rid"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Orthck-Windows-x64
          path: dist/Orthck-Windows-win-x64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Orthck-Windows-arm64
          path: dist/Orthck-Windows-win-arm64/
          if-no-files-found: error

  # Cada versão da main vira uma Release com os .zip: link direto, sem precisar abrir o Actions.
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pacotes
          (cd Orthck-Windows-x64 && zip -qr ../Orthck-Windows-x64.zip .)
          (cd Orthck-Windows-arm64 && zip -qr ../Orthck-Windows-arm64.zip .)
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" Orthck-Windows-x64.zip Orthck-Windows-arm64.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Orthck Windows $tag (versão de teste)" \
            --notes "Versão de teste gerada automaticamente a partir da main (${{ github.sha }}). Não homologada para uso clínico.

          - **Orthck-Windows-x64.zip**: PCs com Windows comuns (Intel/AMD).
          - **Orthck-Windows-arm64.zip**: Windows 11 em Mac com chip Apple (Parallels, VMware Fusion, UTM).

          Descompacte e abra \`Orthck.Windows.exe\`. Se aparecer \"O Windows protegeu o computador\", clique em **Mais informações → Executar assim mesmo** (o app ainda não tem assinatura digital)."
