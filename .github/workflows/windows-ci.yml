name: Windows — compilar e testar Orthck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar núcleo
        run: dotnet build src/Orthck.Core/Orthck.Core.csproj --configuration Release
      - name: Testes de regressão sem Word
        run: dotnet run --project tests/Orthck.SmokeTests/Orthck.SmokeTests.csproj --configuration Release
      - name: Compilar aplicativo WPF
        run: dotnet build src/Orthck.Windows/Orthck.Windows.csproj --configuration Release
      # Um único Orthck.exe com o .NET e o WPF dentro: copiar e abrir, sem instalar nada.
      # x64 também roda no Windows 11 de Macs com chip Apple (emulação).
      - name: Publicar Orthck.exe (arquivo único)
        run: >
          dotnet publish src/Orthck.Windows/Orthck.Windows.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=none -o dist
      - name: Conferir arquivo único
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 1) { throw "Esperado só o .exe em dist/, encontrado: $($files.Name -join ', ')" }
          Move-Item dist/Orthck.Windows.exe dist/Orthck.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Orthck-Windows
          path: dist/Orthck.exe
          if-no-files-found: error

  # Cada versão da main vira uma Release com o Orthck.exe: link direto, sem precisar abrir o Actions.
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pacotes/Orthck-Windows
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" Orthck.exe \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Orthck Windows $tag (versão de teste)" \
            --notes "Versão de teste gerada automaticamente a partir da main (${{ github.sha }}). Não homologada para uso clínico.

          Baixe **Orthck.exe** e abra com dois cliques: é um arquivo único, não precisa instalar nada. Se aparecer \"O Windows protegeu o computador\", clique em **Mais informações → Executar assim mesmo** (o app ainda não tem assinatura digital)."
